name: 🎬 Auto-Sync Movies to Phantom Movies

on:
  schedule:
    # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub UI / mobile app
    inputs:
      movie_count:
        description: 'Number of new movies to add'
        required: false
        default: '5'
        type: string

permissions:
  contents: write

jobs:
  sync-movies:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Movie Sync Engine
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          COUNT="${{ github.event.inputs.movie_count }}"
          if [ -z "$COUNT" ]; then
            COUNT="5"
          fi
          echo "Fetching $COUNT new movies..."
          python scripts/auto_sync.py --count "$COUNT"

      - name: 🚀 Commit and Push to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content.json
          
          if git diff --staged --quiet; then
            echo "No new movies to commit."
          else
            git commit -m "🎬 Auto-sync: Added new movies [skip ci]"
            git push origin main
            echo "Successfully pushed latest movies to GitHub Pages!"
          fi
